spring.application.name=foodService
spring.config.import=optional:application-local.properties

# MongoDB Atlas — set MONGODB_URI in your environment or application-local.properties
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:snackService}
spring.mongodb.representation.uuid=standard

# Food images are proxied through this service and stored in a private S3 bucket.
app.images.bucket=${S3_IMAGE_BUCKET:}
app.images.region=${S3_IMAGE_REGION:us-east-1}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
